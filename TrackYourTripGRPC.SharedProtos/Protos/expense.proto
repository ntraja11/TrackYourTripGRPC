syntax = "proto3";

option csharp_namespace = "TrackYourTripGRPC.SharedProtos.Protos";

import "google/protobuf/timestamp.proto";
import "member.proto";

package expense;

service Expense {
  rpc GetExpense (GetExpenseRequest) returns (GetExpenseResponse);
  rpc GetAllExpensesByTrip (GetAllExpensesByTripRequest) returns (GetAllExpensesByTripResponse);
  rpc GetAllExpensesByMember (GetAllExpensesByMemberRequest) returns (GetAllExpensesByMemberResponse);
  rpc CreateExpense (CreateExpenseRequest) returns (CreateExpenseResponse);
  rpc UpdateExpense (UpdateExpenseRequest) returns (UpdateExpenseResponse);
  rpc DeleteExpense (DeleteExpenseRequest) returns (DeleteExpenseResponse);
}

message ExpenseDetail {
  int32 id = 1;
  string title = 2;
  string description = 3;
  double amount = 4;
  int32 tripId = 5;
  int32 memberId = 6;  
  google.protobuf.Timestamp expenseDate = 7;
  member.MemberDetail member = 8;
}

message GetExpenseRequest {
  int32 id = 1;
}

message GetExpenseResponse {
  ExpenseDetail expense = 1;
}

message GetAllExpensesByTripRequest {
  int32 tripId = 1;
}

message GetAllExpensesByTripResponse {
  repeated ExpenseDetail expenses = 1;
}

message GetAllExpensesByMemberRequest {
  int32 memberId = 1;
}

message GetAllExpensesByMemberResponse {
  repeated ExpenseDetail expenses = 1;
}


message CreateExpenseRequest {
  string title = 1;
  string description = 2;
  double amount = 3;
  int32 tripId = 4;
  int32 memberId = 5;
}

message CreateExpenseResponse {
  ExpenseDetail expense = 1;
}

message UpdateExpenseRequest {
  int32 id = 1;
  string title = 2;
  string description = 3;
  double amount = 4;
  int32 tripId = 5;
  int32 memberId = 6;
}

message UpdateExpenseResponse {
  ExpenseDetail expense = 1;
}

message DeleteExpenseRequest {
  int32 id = 1;
}

message DeleteExpenseResponse {
  bool success = 1;
}
